<!doctype html>
<meta charset="utf-8">
<title>PBKDF2 key derivation benchmark</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem; }
  pre { white-space: pre-wrap; }
  button { font: inherit; }
</style>
<h1>PBKDF2 key derivation benchmark</h1>
<p>
  Measures <code>importKey(PBKDF2)</code> followed by
  <code>deriveKey(AES-GCM 256)</code>. It does not encrypt or decrypt payload data.
</p>
<button id="run">Run benchmark</button>
<pre id="result">Ready.</pre>
<script type="module">
const run = async () => {
  const iterationCounts = [8192, 32000, 64000, 128000, 600000];
  const password = new TextEncoder().encode('1234567890');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const results = [];

  for (const iterations of iterationCounts) {
    const samples = [];

    for (let i = 0; i < 5; i++) {
      const start = performance.now();
      const base = await crypto.subtle.importKey(
        'raw',
        password,
        'PBKDF2',
        false,
        ['deriveKey']
      );

      await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations,
          hash: 'SHA-256'
        },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );

      samples.push(performance.now() - start);
    }

    samples.sort((a, b) => a - b);
    results.push({ iterations, median: samples[2], samples });
  }

  return {
    userAgent: navigator.userAgent,
    hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory,
    iterations: iterationCounts,
    runsPerCount: 5,
    algorithm: 'PBKDF2-HMAC-SHA-256 -> AES-GCM 256',
    results
  };
};

document.querySelector('#run').addEventListener('click', async () => {
  const button = document.querySelector('#run');
  button.disabled = true;
  document.querySelector('#result').textContent = 'Running…';
  try {
    document.querySelector('#result').textContent = JSON.stringify(await run(), null, 2);
  }
  finally {
    button.disabled = false;
  }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module">
    import { Signal, Computed, signal, computed, batch, effect, dispose, subscribe, unsubscribe } from '../src/dom-signals.js';

    let { app } = globalThis;
    let text = signal('test');
    let num = signal(0);
    let comp = computed(() => `${text.value} ${num.value}`, [text, num]);
    let wr = new WeakRef(app);

    (function ({ app }) {
      subscribe(app, comp, () => {
        app.textContent = comp.value;
      });
    }(globalThis));

    document.body.prepend(app);

    globalThis.text = text;
    globalThis.num = num;
    globalThis.comp = comp;
    globalThis.subscribe = subscribe;

    globalThis.fr = new FinalizationRegistry(console.log);
    fr.register(app, 'gone');

    customElements.define('test-shadow', class extends HTMLElement {
      constructor() {
        super();
        const shadow = this.attachShadow({ mode: 'closed' });
        const div = shadow.appendChild(document.createElement('div'));
        subscribe(div, comp, () => {
          div.textContent = `Shadow: ${comp.value}`;
        });
        fr.register(div, 'gone shadow');
      }
    });

    setTimeout(batch, 5000, () => {
      text.value = 'test2';
      num.value = 1;
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <test-shadow></test-shadow>
  <other-shadow></other-shadow>
  <script type="module">
    customElements.define('other-shadow', class extends HTMLElement {
      constructor() {
        super();
        const shadow = this.attachShadow({ mode: 'closed' });
        const div = shadow.appendChild(document.createElement('div'));
        subscribe(div, comp, () => {
          div.textContent = `Other Shadow: ${comp.value}`;
        });
        fr.register(div, 'gone other shadow');
        globalThis.otherShadow = this;
      }
    });
  </script>
</body>
</html>
